<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日交易计划 - Trade Manager</title>
<link rel="stylesheet" href="css/main.css?v=4">
<link rel="stylesheet" href="css/plan.css?v=20260501001">
</head>
<body>

<!-- ===== 顶部导航栏 ===== -->
<header class="app-header">
  <div class="header-left">
    <button class="btn btn-ghost btn-sm" onclick="goBackToMain()" aria-label="返回主页面">
      ← 返回
    </button>
    <div class="app-logo">📅</div>
    <div class="app-title">
      <h1>每日交易计划</h1>
      <span class="app-subtitle">Plan · Execute · Review</span>
    </div>
    <a href="diary2.html" class="btn btn-sm btn-diary2" style="text-decoration: none; margin-left: 12px;">
      📖 复盘总结
    </a>
  </div>
  <div class="header-right">
    <div id="syncStatus" class="sync-status-inline"></div>
    <div id="headerSyncLoggedIn" style="display:none;align-items:center;gap:8px">
      <span class="header-user-badge">👤 <span id="headerUsername">-</span></span>
      <button class="btn btn-sm btn-primary" onclick="handleFullSync()">🔄 同步</button>
      <button class="btn btn-sm btn-ghost" onclick="handleToggleAutoSync()" id="headerBtnAutoSync">自动: 开</button>
      <button class="btn btn-sm btn-ghost" onclick="openChangePasswordModal()">🔐 修改密码</button>
      <button class="btn btn-sm btn-ghost-danger" onclick="handleLogout()">退出</button>
    </div>
    <div id="headerSyncLoggedOut" style="display:flex;align-items:center;gap:8px">
      <button class="btn btn-sm btn-primary" onclick="openLoginModal()">☁️ 登录同步</button>
    </div>
    <div id="adminMenu" style="display:none;align-items:center;gap:8px">
      <span class="header-user-badge admin-badge">🔧 管理员</span>
    </div>
    <div class="theme-divider"></div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换明暗主题">
      <span class="theme-icon-light">🌙</span>
      <span class="theme-icon-dark">☀️</span>
    </button>
  </div>
</header>

<main class="plan-main">

  <!-- 顶部统计卡片 -->
  <section class="plan-summary-row">
    <div class="summary-card stat-blue">
      <div class="stat-label">计划总数</div>
      <div class="stat-value" id="stat-total-count">0</div>
      <div class="stat-sub">所有计划</div>
    </div>
    <div class="summary-card stat-green">
      <div class="stat-label">已完成</div>
      <div class="stat-value" id="stat-completed-count">0</div>
      <div class="stat-sub">完成率 <span id="stat-completed-rate">0%</span></div>
    </div>
    <div class="summary-card stat-yellow">
      <div class="stat-label">执行中</div>
      <div class="stat-value" id="stat-active-count">0</div>
      <div class="stat-sub">已确认+已执行</div>
    </div>
    <div class="summary-card stat-purple">
      <div class="stat-label">实际盈亏</div>
      <div class="stat-value" id="stat-total-pnl">¥0.00</div>
      <div class="stat-sub">已实现盈亏</div>
    </div>
    <div class="summary-card stat-red">
      <div class="stat-label">计划风险</div>
      <div class="stat-value" id="stat-total-risk">¥0.00</div>
      <div class="stat-sub">止损风险敞口</div>
    </div>
  </section>

  <!-- 工具栏 -->
  <section class="plan-toolbar card">
    <div class="toolbar-left">
      <h2>📋 计划列表</h2>
      <span class="toolbar-hint" id="planListHint">加载中...</span>
    </div>
    <div class="toolbar-right">
      <select id="quickDateFilter" class="select-sm" onchange="applyQuickDateFilter()" aria-label="快速日期筛选">
        <option value="all">全部日期</option>
        <option value="today">今日</option>
        <option value="tomorrow">明日</option>
        <option value="thisWeek">本周</option>
        <option value="lastWeek">上周</option>
        <option value="thisMonth">本月</option>
      </select>
      <select id="statusFilter" class="select-sm" onchange="renderPlanList()" aria-label="状态筛选">
        <option value="all">所有状态</option>
        <option value="draft">草稿</option>
        <option value="confirmed">已确认</option>
        <option value="executed">已执行</option>
        <option value="completed">已完成</option>
        <option value="cancelled">已取消</option>
      </select>
      <input type="text" id="searchKeyword" class="input-sm" placeholder="搜索标的/策略..." oninput="renderPlanList()" aria-label="搜索">
      <button class="btn btn-sm btn-ghost" onclick="openTemplateModal()">📋 模板</button>
      <button class="btn btn-sm btn-ghost" onclick="exportAllPlans()">📤 导出</button>
      <button class="btn btn-sm btn-ghost" onclick="document.getElementById('importPlansFile').click()">📥 导入</button>
      <input type="file" id="importPlansFile" accept=".json" style="display:none" onchange="importPlansData(event)">
      <button class="btn btn-sm btn-primary" onclick="createNewPlan()">➕ 新建计划</button>
    </div>
  </section>

  <!-- 图表区 -->
  <section class="plan-charts-row">
    <div class="chart-card card">
      <div class="chart-header">
        <h3>📈 计划 vs 实际 P&amp;L（近 30 天）</h3>
        <div class="chart-legend">
          <span class="legend-item legend-pnl">实际 P&amp;L</span>
          <span class="legend-item legend-risk">计划风险</span>
        </div>
      </div>
      <canvas id="planPnlChart" width="800" height="220"></canvas>
    </div>
    <div class="chart-card card">
      <div class="chart-header">
        <h3>🎯 状态分布</h3>
      </div>
      <canvas id="planStatusChart" width="400" height="220"></canvas>
    </div>
  </section>

  <!-- 计划列表 -->
  <section class="plan-list-section">
    <div id="planList" class="plan-list"></div>
    <div id="planEmptyState" class="empty-state" style="display:none">
      <div class="empty-icon">📅</div>
      <div class="empty-title">还没有计划</div>
      <div class="empty-desc">点击"新建计划"开始你的第一份交易计划</div>
      <button class="btn btn-primary" onclick="createNewPlan()">➕ 新建计划</button>
    </div>
  </section>

</main>

<!-- ===== 计划编辑/查看模态框 ===== -->
<div id="planEditModal" class="modal" style="display:none">
  <div class="modal-content modal-content-xl">
    <div class="modal-header">
      <h3 id="planEditTitle">📅 编辑交易计划</h3>
      <button class="modal-close" onclick="closePlanEditModal()" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="planEditBody">
      <!-- JS 动态渲染 -->
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closePlanEditModal()">取消</button>
      <button class="btn btn-ghost" onclick="saveAsTemplateFromEdit()">保存为模板</button>
      <button class="btn btn-primary" onclick="saveCurrentPlan()">💾 保存</button>
    </div>
  </div>
</div>

<!-- ===== 模板管理模态框 ===== -->
<div id="templateModal" class="modal" style="display:none">
  <div class="modal-content modal-content-md">
    <div class="modal-header">
      <h3>📋 计划模板</h3>
      <button class="modal-close" onclick="closeTemplateModal()" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">
      <div id="templateList" class="template-list"></div>
      <div class="empty-state-mini" id="templateEmptyState" style="display:none">
        <p>还没有模板。编辑计划时点击"保存为模板"可创建模板。</p>
      </div>
    </div>
  </div>
</div>

<!-- ===== 登录/同步/密码模态框（与主页面一致） ===== -->
<!-- 登录 -->
<div id="loginModal" class="modal" style="display:none">
  <div class="modal-content modal-content-sm">
    <div class="modal-header">
      <h3>☁️ 登录 / 注册</h3>
      <button class="modal-close" onclick="closeLoginModal()" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <label>用户名</label>
        <input type="text" id="loginUsername" autocomplete="username">
      </div>
      <div class="modal-field">
        <label>密码</label>
        <input type="password" id="loginPassword" autocomplete="current-password">
      </div>
      <div class="modal-field">
        <label>服务器</label>
        <input type="hidden" id="syncServerUrl" value="/">
        <small id="syncServerDisplay" class="form-hint">自动检测</small>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeLoginModal()">取消</button>
      <button class="btn btn-primary" onclick="handleLogin()">登录</button>
      <button class="btn btn-ghost" onclick="handleRegister()">注册</button>
    </div>
  </div>
</div>

<!-- 修改密码 -->
<div id="changePasswordModal" class="modal" style="display:none">
  <div class="modal-content modal-content-sm">
    <div class="modal-header">
      <h3>🔐 修改密码</h3>
      <button class="modal-close" onclick="closeChangePasswordModal()" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <label>旧密码</label>
        <input type="password" id="oldPassword">
      </div>
      <div class="modal-field">
        <label>新密码</label>
        <input type="password" id="newPassword">
      </div>
      <div class="modal-field">
        <label>确认新密码</label>
        <input type="password" id="confirmPassword">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeChangePasswordModal()">取消</button>
      <button class="btn btn-primary" onclick="handleChangePassword()">确认</button>
    </div>
  </div>
</div>

<!-- ===== 脚本加载 ===== -->
<script src="js/utils.js?v=4"></script>
<script src="js/database.js?v=2"></script>
<script src="js/storage.js?v=4"></script>
<script src="js/sync.js?v=5"></script>
<script src="js/plan.js?v=20260501001"></script>
<script src="js/charts.js?v=4"></script>
<script src="js/plan-page.js?v=20260501001"></script>
<script>
// 主题切换（与其他页面统一使用 app_theme 键名）
function toggleTheme() {
  var html = document.documentElement;
  var current = html.getAttribute('data-theme');
  var next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('app_theme', next);
  // 重绘图表（颜色需要更新）
  if (typeof renderCharts === 'function') renderCharts();
}
(function () {
  var saved = localStorage.getItem('app_theme');
  if (saved) {
    document.documentElement.setAttribute('data-theme', saved);
  }
})();
</script>

</body>
</html>
