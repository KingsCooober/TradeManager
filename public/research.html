<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="研报库已合并进行情总览（easy-stock）的 AI 助手">
<title>研报库已合并 · Trade Manager</title>
<link rel="stylesheet" href="css/main.css?v=22">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-page, #f5f5f7);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1d1d1f;
  }
  .card {
    max-width: 460px;
    padding: 28px 30px;
    border: 1px solid #e5e5ea;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
  }
  h1 { margin: 0 0 10px; font-size: 18px; font-weight: 500; }
  p { margin: 0 0 8px; font-size: 13px; line-height: 1.75; color: #6e6e73; }
  .actions { margin-top: 18px; display: flex; gap: 10px; align-items: center; }
  a.btn {
    display: inline-block; padding: 8px 16px; border-radius: 8px;
    background: #4361ee; color: #fff; text-decoration: none; font-size: 13px;
  }
  a.btn:hover { background: #3a55d9; }
  .hint { font-size: 12px; color: #9a9aa0; }
</style>
</head>
<body>
<div class="card">
  <h1>研报库已合并进行情总览</h1>
  <p>研报的自动抓取没有停，500+ 篇全文仍然保存在本地；</p>
  <p>只是界面收进 <strong>Easy Stock</strong> 的 AI 助手里 —— 直接问「最近算力的研报怎么说」，它会自己检索原文。</p>
  <div class="actions">
    <a class="btn" href="/overview/" id="goOverview">前往 Easy Stock</a>
    <span class="hint" id="hintText">3 秒后自动跳转…</span>
  </div>
</div>

<script>
// easy-stock 用 httpOnly Cookie 鉴权，iframe/跳转带不了 Authorization 头，
// 所以先用本地 token 换一次会话 Cookie，再跳转（与 header.js 的 openOverviewTab 同一思路）。
(function redirect() {
  var token = null;
  try { token = localStorage.getItem('sync_token'); } catch (e) { token = null; }

  function go() {
    window.location.replace('/overview/');
  }

  if (!token) {
    setTimeout(go, 3000);
    return;
  }

  var done = false;
  function once() { if (done) return; done = true; go(); }

  fetch('/api/auth/session', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Authorization': 'Bearer ' + token }
  }).then(once).catch(once);

  // 兜底：接口卡住也不能把用户困在这一页
  setTimeout(once, 3000);
})();
</script>
</body>
</html>
